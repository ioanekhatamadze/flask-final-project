{% extends "base.html" %}

{% block content %}

<h1>Latest Posts</h1>

{% for post in posts %}

<div class="card">
    <h3>{{ post.author.username }}</h3>
    <p>{{ post.content }}</p>
    <p>Views: {{ post.views }}</p>

    <a href="{{ url_for('post', post_id=post.id) }}">
        Read more
    </a>
</div>

{% endfor %}

{% endblock %}
