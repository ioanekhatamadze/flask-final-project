{% extends "base.html" %}

{% block content %}

<div class="card">
<h2>{{ user.username }}</h2>
<p>Total posts: {{ posts_count }}</p>
</div>

{% for post in posts %}
<div class="card">
    <p>{{ post.content }}</p>
    <p>Views: {{ post.views }}</p>
</div>
{% endfor %}

{% endblock %}
